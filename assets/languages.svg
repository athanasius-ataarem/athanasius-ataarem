<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="Languages across all repositories including private">
  <style>
    .title { font: 600 15px 'Segoe UI', Ubuntu, sans-serif; fill: #58a6ff; }
    .sub   { font: 400 10.5px 'Segoe UI', Ubuntu, sans-serif; fill: #8b949e; }
    .lang  { font: 500 12px 'Segoe UI', Ubuntu, sans-serif; fill: #c9d1d9; }
    .pct   { font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #8b949e; }
  </style>
  <rect width="495" height="195" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <text x="24" y="32" class="title">Languages — all projects</text>
  <text x="24" y="49" class="sub">measured across public + private repositories · November 2026</text>

  <!-- stacked bar: total width 447, x from 24 -->
  <g>
    <rect x="24.0" y="62" width="370.6" height="10" rx="5" fill="#3178c6"/>
    <rect x="394.6" y="62" width="18.9" height="10" fill="#f1e05a"/>
    <rect x="413.5" y="62" width="18.5" height="10" fill="#4F5D95"/>
    <rect x="432.0" y="62" width="9.6" height="10" fill="#336790"/>
    <rect x="441.6" y="62" width="9.4" height="10" fill="#563d7c"/>
    <rect x="451.0" y="62" width="20.0" height="10" rx="2" fill="#8b949e"/>
  </g>

  <!-- legend: two columns -->
  <g>
    <circle cx="32" cy="98" r="5" fill="#3178c6"/>
    <text x="44" y="102" class="lang">TypeScript</text>
    <text x="126" y="102" class="pct">82.9%</text>
    <circle cx="32" cy="126" r="5" fill="#f1e05a"/>
    <text x="44" y="130" class="lang">JavaScript</text>
    <text x="126" y="130" class="pct">4.2%</text>
    <circle cx="32" cy="154" r="5" fill="#4F5D95"/>
    <text x="44" y="158" class="lang">PHP</text>
    <text x="126" y="158" class="pct">4.1%</text>
    <circle cx="262" cy="98" r="5" fill="#336790"/>
    <text x="274" y="102" class="lang">SQL</text>
    <text x="356" y="102" class="pct">2.1%</text>
    <circle cx="262" cy="126" r="5" fill="#563d7c"/>
    <text x="274" y="130" class="lang">CSS</text>
    <text x="356" y="130" class="pct">2.1%</text>
    <circle cx="262" cy="154" r="5" fill="#8b949e"/>
    <text x="274" y="158" class="lang">Other</text>
    <text x="356" y="158" class="pct">4.5%</text>
  </g>
