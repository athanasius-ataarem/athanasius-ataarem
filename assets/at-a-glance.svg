<svg xmlns="http://www.w3.org/2000/svg" width="846" height="210" viewBox="0 0 846 210" role="img" aria-label="Engineering at a glance across public and private repositories">
  <style>
    .title { font: 600 17px 'Segoe UI', Ubuntu, sans-serif; fill: #58a6ff; }
    .sub   { font: 400 11px 'Segoe UI', Ubuntu, sans-serif; fill: #8b949e; }
    .num   { font: 700 30px 'Segoe UI', Ubuntu, sans-serif; fill: #34d399; }
    .lbl   { font: 500 11.5px 'Segoe UI', Ubuntu, sans-serif; fill: #c9d1d9; }
    .lbl2  { font: 400 11px 'Segoe UI', Ubuntu, sans-serif; fill: #8b949e; }
    .mon   { font: 700 11px 'Segoe UI', Ubuntu, sans-serif; fill: #34d399; }
    .what  { font: 500 11px 'Segoe UI', Ubuntu, sans-serif; fill: #c9d1d9; }
  </style>
  <rect width="846" height="210" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <text x="28" y="38" class="title">Engineering at a glance</text>
  <text x="818" y="38" text-anchor="end" class="sub">measured across public + private repositories · November 2026</text>

  <line x1="28" y1="52" x2="818" y2="52" stroke="#21262d" stroke-width="1"/>

  <!-- stat tiles -->
  <g>
    <text x="28"  y="102" class="num">5</text>
    <text x="28"  y="124" class="lbl">production systems</text>
    <text x="28"  y="139" class="lbl2">live &amp; operated solo</text>

    <text x="192" y="102" class="num">2,300+</text>
    <text x="192" y="124" class="lbl">automated tests</text>
    <text x="192" y="139" class="lbl2">run in CI before deploys</text>

    <text x="356" y="102" class="num">1,900+</text>
    <text x="356" y="124" class="lbl">commits</text>
    <text x="356" y="139" class="lbl2">since June 2026, all repos</text>

    <text x="520" y="102" class="num">83%</text>
    <text x="520" y="124" class="lbl">TypeScript</text>
    <text x="520" y="139" class="lbl2">of ~20 MB of code</text>

    <text x="684" y="102" class="num">30</text>
    <text x="684" y="124" class="lbl">days: idea → production</text>
    <text x="684" y="139" class="lbl2">leave portal, Jul 2026</text>
  </g>

  <line x1="28" y1="158" x2="818" y2="158" stroke="#21262d" stroke-width="1"/>

  <!-- what shipped, by month -->
  <text x="28" y="186" class="lbl2">shipped, 2026:</text>
  <g>
    <text x="108" y="186"><tspan class="mon">Jun</tspan><tspan class="what" dx="6">IT Helpdesk</tspan></text>
    <text x="218" y="186"><tspan class="mon">Jul</tspan><tspan class="what" dx="6">Leave Portal</tspan></text>
    <text x="334" y="186"><tspan class="mon">Sep</tspan><tspan class="what" dx="6">Lodge bookings + payments</tspan></text>
    <text x="530" y="186"><tspan class="mon">Oct</tspan><tspan class="what" dx="6">Fleet system + SSO</tspan></text>
    <text x="685" y="186"><tspan class="mon">Nov</tspan><tspan class="what" dx="6">Website rebuild</tspan></text>
  </g>
</svg>
